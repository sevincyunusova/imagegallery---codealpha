<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="A curated visual gallery featuring nature, city, people, and architecture.">

    <title>Gallery — Image Gallery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">

        <h1>Gallery</h1>

        <p class="subtitle">
            A small visual collection. Filter by category,
            open an image, and navigate with the arrows.
        </p>
    </header>


    <nav class="filters" id="filters" aria-label="Gallery filters">

        <button
            class="filter-btn active"
            type="button"
            data-filter="all"
            aria-pressed="true">
            All
        </button>

        <button
            class="filter-btn"
            type="button"
            data-filter="nature"
            aria-pressed="false">
            Nature
        </button>

        <button
            class="filter-btn"
            type="button"
            data-filter="city"
            aria-pressed="false">
            City
        </button>

        <button
            class="filter-btn"
            type="button"
            data-filter="people"
            aria-pressed="false">
            People
        </button>

        <button
            class="filter-btn"
            type="button"
            data-filter="architecture"
            aria-pressed="false">
            Architecture
        </button>

    </nav>


    <main>
        <section
            class="gallery"
            id="gallery"
            aria-label="Image gallery">
        </section>
    </main>


    <footer class="site-footer">
        <p>
            Keyboard:
            <kbd>←</kbd>
            <kbd>→</kbd>
            to navigate,
            <kbd>Esc</kbd>
            to close.
        </p>
    </footer>


    <div
        class="lightbox"
        id="lightbox"
        aria-hidden="true"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lightboxTitle">

        <div
            class="lightbox-backdrop"
            id="lightboxBackdrop">
        </div>

        <button
            class="lightbox-close"
            id="lightboxClose"
            type="button"
            aria-label="Close">
            &times;
        </button>

        <button
            class="lightbox-nav lightbox-prev"
            id="lightboxPrev"
            type="button"
            aria-label="Previous image">
            &#10094;
        </button>


        <figure class="lightbox-figure">

            <div class="lightbox-imgwrap">
                <img
                    id="lightboxImg"
                    src=""
                    alt=""
                    draggable="false">
            </div>

            <figcaption>
                <span
                    class="placard-index"
                    id="lightboxIndex">
                    Fig. 01
                </span>

                <span
                    class="placard-title"
                    id="lightboxTitle">
                    Title
                </span>

                <span
                    class="placard-cat"
                    id="lightboxCat">
                    Category
                </span>
            </figcaption>

        </figure>


        <button
            class="lightbox-nav lightbox-next"
            id="lightboxNext"
            type="button"
            aria-label="Next image">
            &#10095;
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
